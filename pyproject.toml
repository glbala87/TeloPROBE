[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teloprobe"
version = "2.0.0"
description = "Robust telomere length estimation from long-read sequencing data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pysam>=0.22",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "ruptures>=1.1.9",
    "hmmlearn>=0.3",
    "plotly>=5.15",
    "jinja2>=3.1",
    "edlib>=1.3",
    "scikit-learn>=1.3",
    "natsort>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "snakemake>=8.0",
]

[project.scripts]
teloprobe = "teloprobe.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
